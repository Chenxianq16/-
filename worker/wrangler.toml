name = "cet6-listening-ai"
main = "src/index.js"
compatibility_date = "2026-11-02"

[vars]
ALLOWED_ORIGIN = "https://chenxianq16.github.io"
DEEPSEEK_MODEL = "deepseek-chat"

[[routes]]
pattern = "lingosu.online/cet6-listening-ai/*"
zone_name = "lingosu.online"

[[routes]]
pattern = "lingosu.online/cet6-media/*"
zone_name = "lingosu.online"

[assets]
directory = "../assets"
binding = "ASSETS"
run_worker_first = true

# Configure secrets with Wrangler instead of committing them:
#   npx wrangler secret put DEEPSEEK_API_KEY
