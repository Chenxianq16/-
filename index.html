<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C6 · 六级学习</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F6F8FA',
            ink: '#293744',
            muted: '#788591',
            accent: {
              50: '#EFF4F8',
              100: '#E1EAF2',
              200: '#CAD8E4',
              300: '#B4C7D8',
              400: '#9BB4C9',
              500: '#829EB7',
              600: '#7D9BB5',
              700: '#536F88',
              800: '#425F78',
              900: '#344E65'
            }
          },
          fontFamily: {
            sans: ['Inter', '"Noto Sans SC"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="./assets/coach.css" />
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Navigation -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 shrink-0">
        <div class="w-8 h-8 rounded-lg bg-accent-700 text-white font-mono font-semibold text-sm flex items-center justify-center tracking-tight">C6</div>
        <div class="leading-tight">
          <div class="text-sm font-bold text-ink">六级学习</div>
        </div>
      </div>

      <nav id="main-nav" class="flex items-center gap-1 overflow-x-auto no-scrollbar py-1">
        <button type="button" data-tab="dashboard" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">面板</button>
        <button type="button" data-tab="listening" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">精听</button>
        <button type="button" data-tab="reading" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">阅读</button>
        <button type="button" data-tab="writing" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">写译</button>
        <button type="button" data-tab="srs" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">词库 <span id="nav-srs-badge" class="ml-1 px-1.5 py-0.5 text-[10px] rounded-full bg-accent-50 text-accent-700 font-mono">0</span></button>
        <button type="button" data-tab="mock" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">模考</button>
      </nav>

      <div class="flex items-center gap-2 shrink-0">
        <span id="gamify-pill" class="hidden text-xs font-mono px-2.5 py-1 rounded-full bg-accent-50 text-accent-800 border border-accent-100">Lv.1 · 0 XP</span>
        <button type="button" id="open-settings-btn" class="px-2.5 py-1.5 rounded-lg border border-gray-200 text-xs font-medium text-gray-700 hover:bg-gray-50 transition">设置</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- ==================== TAB 1: DASHBOARD ==================== -->
    <section id="view-dashboard" class="tab-view space-y-6">
      <div class="dashboard-top">
        <div class="study-start">
          <div class="hero-heading">
            <h1>今日学习</h1>
            <span id="countdown-pill"></span>
          </div>
          <div id="energy-switcher" class="duration-switch">
            <button type="button" data-energy="10m" class="energy-btn">10 分钟</button>
            <button type="button" data-energy="20m" class="energy-btn">20 分钟</button>
            <button type="button" data-energy="35m" class="energy-btn">35 分钟</button>
          </div>
          <div id="today-mission-box" class="study-action">
            <span id="mission-title"></span>
            <button type="button" id="start-mission-btn">开始学习 <span aria-hidden="true">↗</span></button>
          </div>
          <a class="practice-link" href="./listening.html">真题精听 <span aria-hidden="true">→</span></a>
        </div>
        <aside class="progress-panel">
          <div class="progress-heading"><h2>学习记录</h2><button type="button" id="checkin-btn"></button></div>
          <div class="progress-stats">
            <div><strong id="stat-streak">0</strong><span>连续天数</span></div>
            <div><strong id="stat-est-total">489</strong><span>当前估分</span></div>
            <div><strong id="stat-srs-due">0</strong><span>待复习</span></div>
          </div>
          <div id="streak-grid" class="streak-grid"></div>
        </aside>
      </div>

      <!-- Score Leverage Chart + Error Pattern Log -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
        <div class="lg:col-span-5 card p-6 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-base font-bold text-ink mt-0.5">分数进度</h2>
            </div>
            <span id="target-badge" class="text-xs font-mono px-2.5 py-1 rounded-full bg-gray-100 text-gray-800">目标 545+</span>
          </div>
          <div class="relative h-64">
            <canvas id="score-chart"></canvas>
          </div>
        </div>

        <div class="lg:col-span-7 card p-6 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h2 class="text-base font-bold text-ink mt-0.5">错题记录</h2>
            </div>
            <button type="button" id="open-add-error-btn" class="px-3 py-1.5 rounded-xl border border-gray-200 text-xs font-medium text-ink hover:bg-gray-50 transition">+ 记录错因</button>
          </div>

          <!-- Pattern Filter -->
          <div id="error-filter-bar" class="flex flex-wrap gap-1.5"></div>

          <!-- Error List -->
          <div id="error-list" class="space-y-2.5 max-h-64 overflow-y-auto pr-1"></div>
        </div>
      </div>
    </section>

    <!-- ==================== TAB 2: LISTENING LAB ==================== -->
    <section id="view-listening" class="tab-view hidden space-y-5">
      <div class="card p-6 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-bold text-ink mt-0.5">听力</h2>
            <a href="./listening.html" class="inline-block mt-2 text-xs font-semibold text-accent-700 underline">真题精听 ↗</a>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <select id="listening-passage-select" class="px-3 py-1.5 rounded-xl border border-gray-200 text-xs sm:text-sm bg-white text-ink"></select>
            <select id="listening-speed-select" class="px-2.5 py-1.5 rounded-xl border border-gray-200 text-xs font-mono bg-white text-ink">
              <option value="0.75">0.75x 慢速</option>
              <option value="0.9">0.90x 精听</option>
              <option value="1" selected>1.00x 原速</option>
              <option value="1.15">1.15x 提速</option>
            </select>
          </div>
        </div>

        <!-- Step Switcher -->
        <div class="inline-flex rounded-xl bg-gray-100 p-1 gap-1" id="listening-step-tabs">
          <button type="button" data-lstep="blind" class="lstep-btn px-3 py-1.5 rounded-lg text-xs font-medium transition">1. 盲听答题</button>
          <button type="button" data-lstep="dictation" class="lstep-btn px-3 py-1.5 rounded-lg text-xs font-medium transition">2. 逐句听写</button>
          <button type="button" data-lstep="transcript" class="lstep-btn px-3 py-1.5 rounded-lg text-xs font-medium transition">3. 原文与错因</button>
        </div>

        <!-- Audio Control Bar -->
        <div class="rounded-xl bg-paper border border-gray-200 p-4 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <button type="button" id="play-passage-btn" class="px-4 py-2 rounded-xl bg-accent-700 hover:bg-accent-800 text-white text-xs font-semibold transition">播放整段音频</button>
            <button type="button" id="stop-audio-btn" class="px-3 py-2 rounded-xl border border-gray-200 bg-white text-xs font-medium text-gray-700 hover:bg-gray-50 transition">停止</button>
          </div>
          <div id="audio-status" class="text-xs font-mono text-muted"></div>
        </div>

        <!-- Step Content Container -->
        <div id="listening-content" class="space-y-4"></div>
      </div>
    </section>

    <!-- ==================== TAB 3: READING LAB ==================== -->
    <section id="view-reading" class="tab-view hidden space-y-5">
      <div class="card p-6 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-bold text-ink mt-0.5">阅读</h2>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <select id="reading-passage-select" class="px-3 py-1.5 rounded-xl border border-gray-200 text-xs sm:text-sm bg-white text-ink"></select>
            <button type="button" id="toggle-hl-mode-btn" class="px-3 py-1.5 rounded-xl border border-accent-200 bg-accent-50 text-accent-800 text-xs font-semibold transition">高亮笔：开启</button>
            <div class="px-3 py-1.5 rounded-xl bg-gray-100 font-mono text-xs text-ink tabular-nums" id="reading-timer-display">09:00</div>
            <button type="button" id="reading-timer-btn" class="px-3 py-1.5 rounded-xl border border-gray-200 text-xs font-medium hover:bg-gray-50 transition">开始计时</button>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <!-- Passage -->
          <div class="lg:col-span-7 space-y-3">
            <div id="reading-passage-body" class="p-5 rounded-xl bg-paper border border-gray-200 space-y-3 text-sm leading-7 text-gray-800"></div>
          </div>

          <!-- Questions & Margin Notes -->
          <div class="lg:col-span-5 space-y-4">
            <div id="reading-questions-box" class="space-y-4"></div>
            <div class="pt-3 border-t border-gray-100 space-y-2">
              <label for="reading-note-input" class="text-xs font-semibold text-gray-700 block">笔记</label>
              <textarea id="reading-note-input" rows="3" placeholder="写点笔记…" class="w-full rounded-xl border border-gray-200 p-3 text-xs focus:outline-none focus:ring-2 focus:ring-accent-600"></textarea>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ==================== TAB 4: WRITING & TRANSLATION ==================== -->
    <section id="view-writing" class="tab-view hidden space-y-5">
      <div class="card p-6 space-y-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-bold text-ink mt-0.5">写作与翻译</h2>
          </div>
          <div class="inline-flex rounded-xl bg-gray-100 p-1 gap-1" id="writing-mode-tabs">
            <button type="button" data-wmode="upgrade" class="wmode-btn px-3 py-1.5 rounded-lg text-xs font-medium transition">逐句升格训练</button>
            <button type="button" data-wmode="translation" class="wmode-btn px-3 py-1.5 rounded-lg text-xs font-medium transition">六级段落汉译英</button>
          </div>
        </div>

        <div id="writing-content" class="space-y-4"></div>
      </div>
    </section>

    <!-- ==================== TAB 5: SRS VOCABULARY ==================== -->
    <section id="view-srs" class="tab-view hidden space-y-5">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
        <div class="lg:col-span-7 card p-6 space-y-5">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-xl font-bold text-ink mt-0.5">词库</h2>
            </div>
            <span id="srs-queue-count" class="text-xs font-mono px-2.5 py-1 rounded-full bg-accent-50 text-accent-800">待复习 0</span>
          </div>

          <div id="srs-card-stage" class="rounded-2xl border border-gray-200 bg-paper p-6 min-h-[260px] flex flex-col justify-between"></div>
        </div>

        <div class="lg:col-span-5 card p-6 space-y-4">
          <h3 class="text-base font-bold text-ink">手动录入新词 / 听力盲词</h3>
          <form id="add-srs-form" class="space-y-3">
            <input type="text" id="new-srs-word" required placeholder="单词或短语" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-accent-600" />
            <input type="text" id="new-srs-meaning" required placeholder="释义" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-accent-600" />
            <input type="text" id="new-srs-note" placeholder="备注（可选）" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-accent-600" />
            <button type="submit" class="w-full py-2.5 rounded-xl bg-accent-700 hover:bg-accent-800 text-white text-xs font-semibold transition">加入词库</button>
          </form>

          <div class="pt-3 border-t border-gray-100">
            <div class="text-xs font-semibold text-gray-700 mb-2">词库清单（最近添加）</div>
            <div id="srs-word-list" class="space-y-1.5 max-h-44 overflow-y-auto text-xs"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ==================== TAB 6: TIMED MOCK ==================== -->
    <section id="view-mock" class="tab-view hidden space-y-5">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
        <div class="lg:col-span-6 card p-6 space-y-4">
          <h2 class="text-xl font-bold text-ink">六级官方限时沙盘</h2>

          <div class="flex flex-wrap gap-2" id="mock-preset-btns">
            <button type="button" data-mins="30" data-label="短文写作" class="mock-preset px-3 py-1.5 rounded-xl border border-gray-200 text-xs font-medium hover:bg-gray-50">写作 30:00</button>
            <button type="button" data-mins="25" data-label="听力理解" class="mock-preset px-3 py-1.5 rounded-xl border border-accent-200 bg-accent-50 text-accent-800 text-xs font-semibold">听力 25:00</button>
            <button type="button" data-mins="40" data-label="阅读理解" class="mock-preset px-3 py-1.5 rounded-xl border border-gray-200 text-xs font-medium hover:bg-gray-50">阅读 40:00</button>
            <button type="button" data-mins="30" data-label="段落翻译" class="mock-preset px-3 py-1.5 rounded-xl border border-gray-200 text-xs font-medium hover:bg-gray-50">翻译 30:00</button>
          </div>

          <div class="rounded-2xl bg-paper border border-gray-200 p-6 text-center space-y-4">
            <div id="mock-section-label" class="text-xs font-semibold text-accent-700">当前计时：听力理解</div>
            <div id="mock-timer-display" class="text-5xl font-mono font-bold text-ink tabular-nums">25:00</div>
            <div class="flex justify-center gap-2">
              <button type="button" id="mock-start-btn" class="px-5 py-2 rounded-xl bg-accent-700 hover:bg-accent-800 text-white text-xs font-semibold transition">开始计时</button>
              <button type="button" id="mock-reset-btn" class="px-4 py-2 rounded-xl border border-gray-200 bg-white text-xs font-medium text-gray-700 hover:bg-gray-50 transition">重置</button>
            </div>
          </div>
        </div>

        <div class="lg:col-span-6 card p-6 space-y-4">
          <h2 class="text-xl font-bold text-ink">模考估分与冲刺预警</h2>

          <form id="mock-log-form" class="grid grid-cols-3 gap-3">
            <div>
              <label class="text-[11px] text-muted block mb-1">听力估分 (0-249)</label>
              <input type="number" id="mock-in-listen" min="0" max="249" value="155" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm font-mono" />
            </div>
            <div>
              <label class="text-[11px] text-muted block mb-1">阅读估分 (0-249)</label>
              <input type="number" id="mock-in-read" min="0" max="249" value="205" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm font-mono" />
            </div>
            <div>
              <label class="text-[11px] text-muted block mb-1">写译估分 (0-212)</label>
              <input type="number" id="mock-in-write" min="0" max="212" value="152" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm font-mono" />
            </div>
            <button type="submit" class="col-span-3 py-2.5 rounded-xl bg-ink hover:bg-gray-800 text-white text-xs font-semibold transition">记录本次模考并更新面板估分</button>
          </form>
          <div id="mock-history-list" class="space-y-2 max-h-40 overflow-y-auto text-xs"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Settings -->
  <div id="settings-modal" class="fixed inset-0 z-50 hidden bg-black/30 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-gray-200 max-w-lg w-full p-6 space-y-5 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-lg font-bold text-ink">学习设置</h3>
        </div>
        <button type="button" id="close-settings-btn" class="w-8 h-8 rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50">✕</button>
      </div>

      <div class="grid grid-cols-2 gap-3 text-xs">
        <div>
          <label class="text-muted block mb-1">听力目标 (满分249)</label>
          <input type="number" id="set-target-listen" min="100" max="249" class="w-full px-3 py-2 rounded-xl border border-gray-200 font-mono" />
        </div>
        <div>
          <label class="text-muted block mb-1">阅读目标 (满分249)</label>
          <input type="number" id="set-target-read" min="100" max="249" class="w-full px-3 py-2 rounded-xl border border-gray-200 font-mono" />
        </div>
        <div>
          <label class="text-muted block mb-1">写译目标 (满分212)</label>
          <input type="number" id="set-target-write" min="80" max="212" class="w-full px-3 py-2 rounded-xl border border-gray-200 font-mono" />
        </div>
        <div class="flex items-end">
          <label class="flex items-center gap-2 cursor-pointer p-2 rounded-xl border border-gray-200 w-full">
            <input type="checkbox" id="set-gamify" class="accent-slate-500 w-4 h-4" />
            <span class="font-medium text-ink">开启积分与等级</span>
          </label>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-gray-100">
        <div class="flex gap-2">
          <button type="button" id="export-json-btn" class="px-3 py-1.5 rounded-xl border border-gray-200 text-xs font-medium hover:bg-gray-50">导出进度</button>
          <button type="button" id="reset-demo-btn" class="px-3 py-1.5 rounded-xl border border-gray-200 text-xs font-medium text-gray-600 hover:bg-gray-50">恢复初始</button>
        </div>
        <button type="button" id="save-settings-btn" class="px-4 py-2 rounded-xl bg-accent-700 hover:bg-accent-800 text-white text-xs font-semibold">保存设置</button>
      </div>
    </div>
  </div>

  <!-- Add Error Modal -->
  <div id="error-modal" class="fixed inset-0 z-50 hidden bg-black/30 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-gray-200 max-w-md w-full p-6 space-y-4 shadow-xl">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-ink">记录新错因</h3>
        <button type="button" id="close-error-modal-btn" class="w-8 h-8 rounded-lg border border-gray-200 text-gray-500">✕</button>
      </div>
      <form id="add-error-form" class="space-y-3 text-xs">
        <select id="err-pattern" class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white">
          <option value="连读弱读漏听">连读弱读漏听（听力）</option>
          <option value="同义替换未识别">同义替换未识别（听/阅）</option>
          <option value="长难句主干偏差">长难句主干偏差（阅读）</option>
          <option value="中式表达直译">中式表达直译（写译）</option>
          <option value="高级句式单一">高级句式单一（写作）</option>
        </select>
        <input type="text" id="err-note" required placeholder="错题内容" class="w-full px-3 py-2 rounded-xl border border-gray-200" />
        <input type="text" id="err-fix" required placeholder="修正方法" class="w-full px-3 py-2 rounded-xl border border-gray-200" />
        <button type="submit" class="w-full py-2.5 rounded-xl bg-accent-700 text-white font-semibold">保存</button>
      </form>
    </div>
  </div>

  <!-- Vocab Popover Modal -->
  <div id="vocab-modal" class="fixed inset-0 z-50 hidden bg-black/20 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-gray-200 max-w-sm w-full p-5 space-y-3 shadow-xl">
      <div class="flex items-center justify-between">
        <span id="vm-word" class="text-lg font-bold text-ink"></span>
        <button type="button" id="close-vocab-modal-btn" class="text-gray-400 hover:text-gray-700">✕</button>
      </div>
      <p id="vm-meaning" class="text-sm text-gray-700"></p>
      <p id="vm-tip" class="text-xs text-muted bg-paper p-2.5 rounded-lg"></p>
      <div class="flex gap-2 pt-1">

          return Object.assign(getDefaultState(), parsed);
        } catch (e) {
          return getDefaultState();

      function todayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.add('hidden'), 2600);
      }

      function addXP(pts) {
        state.xp = (state.xp || 0) + pts;
        saveState();
        renderHeaderExtras();
      }

      function speakText(text, rate = 1.0, onEnd) {
        if (!('speechSynthesis' in window)) {
          showToast('当前浏览器不支持语音合成，请直接查看文本');
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = rate;
        if (onEnd) utter.onend = onEnd;
        window.speechSynthesis.speak(utter);
      }

      function computeStreak() {
        const set = new Set(state.checkedDates || []);
        let streak = 0;
        const d = new Date();
        // If not checked today, check from yesterday
        const tStr = todayStr();
        if (!set.has(tStr)) {
          d.setDate(d.getDate() - 1);
        }
        while (true) {
          const s = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
          if (set.has(s)) {
            streak++;
            d.setDate(d.getDate() - 1);
          } else {
            break;
          }
        }
        return streak;
      }

          },

            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } }
            },
            scales: {

              x: { grid: { display: false } }
            }
          }

      // ---------- Render Listening Lab ----------
      function renderListening() {
        const sel = document.getElementById('listening-passage-select');
        sel.innerHTML = '';
        LISTENING_PASSAGES.forEach((p, idx) => {
          const opt = document.createElement('option');
          opt.value = String(idx);
          opt.textContent = `[${p.type}] ${p.title}`;
          if (idx === state.listeningIdx) opt.selected = true;
          sel.appendChild(opt);
        });

        document.querySelectorAll('.lstep-btn').forEach(btn => {
          const active = btn.dataset.lstep === state.listeningStep;
          btn.className = active
            ? 'lstep-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-ink shadow-sm transition'
            : 'lstep-btn px-3 py-1.5 rounded-lg text-xs font-medium text-gray-600 hover:text-ink transition';
        });

        const passage = LISTENING_PASSAGES[state.listeningIdx] || LISTENING_PASSAGES[0];
        const container = document.getElementById('listening-content');
        container.innerHTML = '';

        if (state.listeningStep === 'blind') {
          const box = document.createElement('div');
          box.className = 'space-y-4';
          box.innerHTML = `
            <div class="p-4 rounded-xl border border-gray-200 space-y-3">
              <div class="text-sm font-semibold text-ink">${passage.question}</div>
              <div class="space-y-2" id="l-options"></div>
              <div id="l-feedback" class="hidden rounded-xl p-3 text-xs"></div>
            </div>
          `;
          container.appendChild(box);
          const optWrap = box.querySelector('#l-options');
          passage.options.forEach((optText, i) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'w-full text-left px-4 py-2.5 rounded-xl border border-gray-200 text-xs sm:text-sm hover:bg-accent-50/50 transition';
            b.textContent = optText;
            b.addEventListener('click', () => {
              const fb = box.querySelector('#l-feedback');
              fb.classList.remove('hidden');
              if (i === passage.answerIdx) {
                fb.className = 'rounded-xl p-3 text-xs bg-accent-50 text-accent-900 border border-accent-200';
                fb.innerHTML = `<strong>✓ 回答正确。</strong> ${passage.explanation}`;
                addXP(15);
              } else {
                fb.className = 'rounded-xl p-3 text-xs bg-amber-50 text-amber-900 border border-amber-200';
                fb.innerHTML = `<strong>× 答案应为 ${passage.options[passage.answerIdx].slice(0, 2)}。</strong> ${passage.explanation}`;
              }
            });
            optWrap.appendChild(b);
          });
        } else if (state.listeningStep === 'dictation') {

          passage.sentences.forEach((sent, idx) => {
            const row = document.createElement('div');
            row.className = 'p-4 rounded-xl border border-gray-200 space-y-2.5';
            row.innerHTML = `
              <div class="flex items-center justify-between">
                <span class="text-xs font-mono font-semibold text-accent-700">Sentence ${idx + 1}</span>
                <button type="button" class="play-sent-btn px-3 py-1 rounded-lg bg-accent-50 text-accent-800 text-xs font-semibold hover:bg-accent-100">播放</button>
              </div>
              <input type="text" class="dict-input w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-accent-600" placeholder="输入听写…" />
              <div class="flex items-center justify-between gap-2">
                <button type="button" class="check-dict-btn px-3 py-1.5 rounded-lg bg-ink text-white text-xs font-medium">比对差异</button>
                <span class="dict-score text-xs font-mono text-muted"></span>
              </div>
              <div class="dict-diff hidden text-xs leading-relaxed p-3 rounded-lg bg-paper border border-gray-200"></div>
            `;
            row.querySelector('.play-sent-btn').addEventListener('click', () => {
              const rate = parseFloat(document.getElementById('listening-speed-select').value) || 1;
              speakText(sent, rate);
            });
            row.querySelector('.check-dict-btn').addEventListener('click', () => {
              const userVal = row.querySelector('.dict-input').value.trim();
              const clean = s => s.toLowerCase().replace(/[^a-z0-9'\s]/g, '').split(/\s+/).filter(Boolean);
              const targetWords = clean(sent);
              const userWords = new Set(clean(userVal));
              let hit = 0;
              const diffHtml = sent.split(/\s+/).map(rawW => {
                const key = rawW.toLowerCase().replace(/[^a-z0-9']/g, '');
                if (userWords.has(key)) {
                  hit++;
                  return `<span class="text-accent-800 font-medium">${rawW}</span>`;
                }
                return `<span class="bg-amber-100 text-amber-900 px-1 rounded underline decoration-amber-400 cursor-pointer missed-word" data-w="${key}">${rawW}</span>`;
              }).join(' ');
              const pct = Math.round((hit / Math.max(1, targetWords.length)) * 100);
              row.querySelector('.dict-score').textContent = `匹配率 ${pct}%`;
              const diffBox = row.querySelector('.dict-diff');
              diffBox.classList.remove('hidden');
              diffBox.innerHTML = `<div class="mb-1 text-xs text-muted">原文</div><div>${diffHtml}</div>`;
              diffBox.querySelectorAll('.missed-word').forEach(span => {
                span.addEventListener('click', () => {
                  const w = span.dataset.w;
                  if (!w) return;
                  if (!state.srsCards.some(c => c.word.toLowerCase() === w)) {
                    state.srsCards.unshift({
                      id: 's_' + Date.now(),
                      word: w,
                      meaning: '（听力听写漏听词，待补充释义）',
                      note: `来自精听：${passage.title}`,
                      source: '听力漏听',
                      reps: 0,
                      interval: 0,
                      due: Date.now()
                    });
                    saveState();
                    renderHeaderExtras();
                    showToast(`已将 "${w}" 加入 SRS 错词本`);
                  } else {
                    showToast(`"${w}" 已在词库中`);
                  }
                });
              });
              addXP(10);
            });
            container.appendChild(row);
          });
        } else {
          const wrap = document.createElement('div');
          wrap.className = 'p-5 rounded-xl bg-paper border border-gray-200 space-y-3';
          wrap.innerHTML = `
            <div class="text-xs font-semibold text-accent-800">完整听力原文</div>
            <div class="space-y-2 text-sm leading-7 text-gray-800">
              ${passage.sentences.map((s, i) => `<p><span class="font-mono text-xs text-muted mr-2">${i + 1}.</span>${s}</p>`).join('')}
            </div>
            <div class="pt-3 border-t border-gray-200 text-xs text-gray-700">
              <strong>解题与错因提示：</strong> ${passage.explanation}
            </div>
          `;
          container.appendChild(wrap);
        }
      }

      // ---------- Render Reading Lab ----------
      let hlModeActive = true;
      function renderReading() {
        const sel = document.getElementById('reading-passage-select');
        sel.innerHTML = '';
        READING_PASSAGES.forEach((p, idx) => {
          const opt = document.createElement('option');
          opt.value = String(idx);
          opt.textContent = p.title;
          if (idx === state.readingIdx) opt.selected = true;
          sel.appendChild(opt);
        });

        const passage = READING_PASSAGES[state.readingIdx] || READING_PASSAGES[0];
        const body = document.getElementById('reading-passage-body');
        body.innerHTML = '';
        const hlSet = new Set(state.highlights[passage.id] || []);

        passage.sentences.forEach((sent, idx) => {
          const p = document.createElement('p');
          p.className = 'hl-sentence ' + (hlSet.has(idx) ? 'active-hl' : '');
          // Wrap known vocab chips
          let html = sent;
          Object.keys(passage.vocab).forEach(vKey => {
            const re = new RegExp(`\\b(${vKey})\\b`, 'gi');
            html = html.replace(re, `<span class="vocab-chip" data-vocab="${vKey}">$1</span>`);
          });
          p.innerHTML = html;
          p.addEventListener('click', (e) => {
            if (e.target.classList.contains('vocab-chip')) {
              e.stopPropagation();
              openVocabModal(e.target.dataset.vocab, passage.vocab[e.target.dataset.vocab]);
              return;
            }
            if (!hlModeActive) return;
            const list = state.highlights[passage.id] || [];
            if (list.includes(idx)) {
              state.highlights[passage.id] = list.filter(x => x !== idx);
            } else {
              state.highlights[passage.id] = [...list, idx];
            }
            saveState();
            renderReading();
          });
          body.appendChild(p);
        });

        // Questions
        const qBox = document.getElementById('reading-questions-box');
        qBox.innerHTML = '';
        passage.questions.forEach((qItem, qIdx) => {
          const card = document.createElement('div');
          card.className = 'p-4 rounded-xl border border-gray-200 space-y-2.5';
          card.innerHTML = `
            <div class="text-xs font-semibold text-ink">${qItem.q}</div>
            <div class="space-y-1.5 rq-opts"></div>
            <div class="rq-fb hidden text-xs p-2.5 rounded-lg"></div>
          `;
          const optsEl = card.querySelector('.rq-opts');
          qItem.options.forEach((o, oi) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'w-full text-left px-3 py-2 rounded-lg border border-gray-200 text-xs hover:bg-accent-50/50 transition';
            b.textContent = o;
            b.addEventListener('click', () => {
              const fb = card.querySelector('.rq-fb');
              fb.classList.remove('hidden');
              if (oi === qItem.ans) {
                fb.className = 'rq-fb text-xs p-2.5 rounded-lg bg-accent-50 text-accent-900 border border-accent-200';
                fb.innerHTML = `<strong>✓ 正确。</strong> ${qItem.exp}`;
                addXP(10);
              } else {
                fb.className = 'rq-fb text-xs p-2.5 rounded-lg bg-amber-50 text-amber-900 border border-amber-200';
                fb.innerHTML = `<strong>× 正解为 ${qItem.options[qItem.ans].slice(0, 2)}。</strong> ${qItem.exp}`;
              }
            });
            optsEl.appendChild(b);
          });
          qBox.appendChild(card);
        });

        const noteInput = document.getElementById('reading-note-input');
        noteInput.value = state.readingNotes[passage.id] || '';
        noteInput.oninput = () => {
          state.readingNotes[passage.id] = noteInput.value;
          saveState();
        };
      }

      function openVocabModal(word, info) {
        currentVocabTarget = { word, ...info };
        document.getElementById('vm-word').textContent = word;
        document.getElementById('vm-meaning').textContent = info.meaning;
        document.getElementById('vm-tip').textContent = info.tip;
        document.getElementById('vocab-modal').classList.remove('hidden');
      }

      // ---------- Render Writing & Translation ----------
      function renderWriting() {
        document.querySelectorAll('.wmode-btn').forEach(btn => {
          const active = btn.dataset.wmode === state.writingMode;
          btn.className = active
            ? 'wmode-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-ink shadow-sm transition'
            : 'wmode-btn px-3 py-1.5 rounded-lg text-xs font-medium text-gray-600 hover:text-ink transition';
        });

        const wrap = document.getElementById('writing-content');
        wrap.innerHTML = '';

        if (state.writingMode === 'upgrade') {
          WRITING_STEPS.forEach(item => {
            const box = document.createElement('div');
            box.className = 'p-5 rounded-xl border border-gray-200 bg-paper space-y-3';
            const savedVal = state.writingDrafts[item.id] || '';
            box.innerHTML = `
              <div class="text-xs font-semibold text-accent-800">${item.topic}</div>
              <div class="p-3 rounded-lg bg-white border border-gray-200 text-sm text-gray-800">
                <span class="text-[11px] font-mono text-muted block mb-1">原句</span>
                ${item.raw}
              </div>
              <div class="text-xs text-gray-600">${item.diag}</div>
              <div class="text-xs text-accent-800 bg-accent-50/70 p-2.5 rounded-lg border border-accent-100">升格提示：${item.stepHint}</div>
              <textarea rows="2" class="w-draft w-full rounded-xl border border-gray-200 p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-accent-600" placeholder="输入改写…">${savedVal}</textarea>
              <div class="flex items-center justify-between">
                <button type="button" class="toggle-ref-btn px-3 py-1.5 rounded-xl bg-accent-700 text-white text-xs font-semibold">查看参考</button>
              </div>
              <div class="w-ref hidden p-3 rounded-xl bg-white border border-accent-200 text-sm text-accent-900">
                <span class="text-[11px] font-mono text-accent-700 block mb-1">参考改写</span>
                ${item.upgraded}
              </div>
            `;
            box.querySelector('.w-draft').addEventListener('input', (e) => {
              state.writingDrafts[item.id] = e.target.value;
              saveState();
            });
            box.querySelector('.toggle-ref-btn').addEventListener('click', () => {
              box.querySelector('.w-ref').classList.toggle('hidden');
              addXP(10);
            });
            wrap.appendChild(box);
          });
        } else {
          TRANSLATION_TASKS.forEach(t => {
            const box = document.createElement('div');
            box.className = 'p-5 rounded-xl border border-gray-200 bg-paper space-y-3';
            const savedVal = state.translationDrafts[t.id] || '';
            box.innerHTML = `
              <div class="text-sm font-bold text-ink">${t.title}</div>
              <p class="text-sm leading-7 text-gray-800 bg-white p-4 rounded-xl border border-gray-200">${t.chinese}</p>
              <div class="flex flex-wrap gap-1.5">
                ${t.keywords.map(k => `<span class="px-2 py-0.5 rounded-md bg-accent-50 text-accent-800 text-[11px] font-mono">${k}</span>`).join('')}
              </div>
              <textarea rows="4" class="t-draft w-full rounded-xl border border-gray-200 p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-accent-600" placeholder="输入翻译…">${savedVal}</textarea>
              <div class="flex flex-wrap items-center justify-between gap-2">
                <button type="button" class="toggle-tref-btn px-3 py-1.5 rounded-xl bg-accent-700 text-white text-xs font-semibold">查看译文</button>
              </div>
              <div class="t-ref hidden p-4 rounded-xl bg-white border border-accent-200 space-y-2">
                <div class="text-xs font-semibold text-accent-800">参考译文：</div>
                <p class="text-sm leading-6 text-gray-800">${t.reference}</p>
              </div>
            `;
            box.querySelector('.t-draft').addEventListener('input', (e) => {
              state.translationDrafts[t.id] = e.target.value;
              saveState();
            });
            box.querySelector('.toggle-tref-btn').addEventListener('click', () => {
              box.querySelector('.t-ref').classList.toggle('hidden');
              addXP(15);
            });
            wrap.appendChild(box);
          });
        }
      }

      // ---------- Render SRS ----------
      function renderSRS() {
        const dueCards = state.srsCards.filter(c => c.due <= Date.now());
        document.getElementById('srs-queue-count').textContent = `待复习 ${dueCards.length} / 总计 ${state.srsCards.length}`;

        const stage = document.getElementById('srs-card-stage');
        stage.innerHTML = '';

        if (dueCards.length === 0) {
          stage.innerHTML = `
            <div class="flex-1 flex flex-col items-center justify-center text-center space-y-3 py-8">
              <div class="text-2xl font-bold text-accent-700">今日复习完成</div>
              <button type="button" id="srs-review-all-btn" class="px-4 py-2 rounded-xl border border-gray-200 bg-white text-xs font-semibold hover:bg-gray-50">提前复习全部词卡</button>
            </div>
          `;
          stage.querySelector('#srs-review-all-btn').addEventListener('click', () => {
            state.srsCards.forEach(c => { c.due = Date.now(); });
            saveState();
            renderSRS();
          });
        } else {
          const card = dueCards[0];
          const top = document.createElement('div');
          top.className = 'space-y-3';
          top.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="px-2 py-0.5 rounded-md bg-accent-50 text-accent-800 text-[11px] font-medium">${card.source}</span>
              <button type="button" id="srs-speak-btn" class="px-2.5 py-1 rounded-lg border border-gray-200 bg-white text-xs hover:bg-gray-50">朗读</button>
            </div>
            <div class="text-3xl font-bold text-ink tracking-tight py-4">${card.word}</div>
            ${srsFlipped ? `
              <div class="p-4 rounded-xl bg-white border border-gray-200 space-y-1.5">
                <div class="text-sm font-semibold text-accent-900">${card.meaning}</div>
                <div class="text-xs text-muted">${card.note || ''}</div>
              </div>
            ` : ''}
          `;
          stage.appendChild(top);
          top.querySelector('#srs-speak-btn').addEventListener('click', () => speakText(card.word, 0.95));

          const actions = document.createElement('div');
          actions.className = 'pt-4';
          if (!srsFlipped) {
            actions.innerHTML = `<button type="button" id="srs-flip-btn" class="w-full py-2.5 rounded-xl bg-ink text-white text-xs font-semibold">显示释义</button>`;
            actions.querySelector('#srs-flip-btn').addEventListener('click', () => {
              srsFlipped = true;
              renderSRS();
            });
          } else {
            actions.className = 'pt-4 grid grid-cols-4 gap-2';
            const grades = [
              { label: '忘记 (<1m)', days: 0 },
              { label: '模糊 (1d)', days: 1 },
              { label: '记得 (3d)', days: 3 },
              { label: '熟练 (7d)', days: 7 }
            ];
            grades.forEach(g => {
              const b = document.createElement('button');
              b.type = 'button';
              b.className = 'py-2 rounded-xl border border-gray-200 bg-white hover:bg-accent-50 text-xs font-medium transition';
              b.textContent = g.label;
              b.addEventListener('click', () => {
                card.reps = (card.reps || 0) + 1;
                card.interval = g.days;
                card.due = Date.now() + (g.days === 0 ? 60 * 1000 : g.days * 86400000);
                srsFlipped = false;
                addXP(5);
                saveState();
                renderHeaderExtras();
                renderSRS();
              });
              actions.appendChild(b);
            });
          }
          stage.appendChild(actions);
        }

        const listEl = document.getElementById('srs-word-list');
        listEl.innerHTML = '';
        state.srsCards.slice(0, 12).forEach(c => {
          const item = document.createElement('div');
          item.className = 'flex items-center justify-between py-1.5 border-b border-gray-100';
          item.innerHTML = `
            <div><span class="font-semibold text-ink">${c.word}</span> <span class="text-muted ml-1">${c.meaning}</span></div>
            <span class="text-[10px] font-mono text-accent-700">${c.source}</span>
          `;
          listEl.appendChild(item);
        });
      }

      // ---------- Render Mock ----------
      function renderMock() {
        const histEl = document.getElementById('mock-history-list');
        histEl.innerHTML = '';
        if (state.mockHistory.length === 0) {
          histEl.innerHTML = '<div class="text-muted text-center py-3">暂无记录</div>';
        } else {
          state.mockHistory.forEach(m => {
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between p-2.5 rounded-lg bg-paper border border-gray-200';
            row.innerHTML = `
              <span class="font-mono text-muted">${m.date}</span>
              <span>听 ${m.listen} / 阅 ${m.read} / 写译 ${m.write}</span>
              <span class="font-mono font-bold text-accent-700">总 ${m.total}</span>
            `;
            histEl.appendChild(row);

      }

      // ---------- Event Listeners ----------
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      document.querySelectorAll('.energy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.energyMode = btn.dataset.energy;
          saveState();
          renderDashboard();
        });
      });

      document.getElementById('checkin-btn').addEventListener('click', () => {
        const t = todayStr();
        if (!state.checkedDates.includes(t)) {
          state.checkedDates.push(t);
          addXP(20);
          saveState();
          renderDashboard();
          showToast('今日打卡已记录');
        }
      });

      // Listening controls
      document.getElementById('listening-passage-select').addEventListener('change', (e) => {
        state.listeningIdx = parseInt(e.target.value, 10) || 0;
        saveState();
        renderListening();
      });

      document.querySelectorAll('.lstep-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.listeningStep = btn.dataset.lstep;
          saveState();
          renderListening();
        });
      });

      document.getElementById('play-passage-btn').addEventListener('click', () => {
        const p = LISTENING_PASSAGES[state.listeningIdx] || LISTENING_PASSAGES[0];
        const rate = parseFloat(document.getElementById('listening-speed-select').value) || 1;
        document.getElementById('audio-status').textContent = `正在播放：${p.title} (${rate}x)`;
        speakText(p.sentences.join(' '), rate, () => {
          document.getElementById('audio-status').textContent = '播放完毕';
        });

      document.getElementById('stop-audio-btn').addEventListener('click', () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        document.getElementById('audio-status').textContent = '已停止播放';
      });

      // Reading controls
      document.getElementById('reading-passage-select').addEventListener('change', (e) => {
        state.readingIdx = parseInt(e.target.value, 10) || 0;
        saveState();
        renderReading();
      });

      document.getElementById('toggle-hl-mode-btn').addEventListener('click', (e) => {
        hlModeActive = !hlModeActive;
        e.target.textContent = hlModeActive ? '高亮笔：开启' : '高亮笔：关闭';
        e.target.className = hlModeActive
          ? 'px-3 py-1.5 rounded-xl border border-accent-200 bg-accent-50 text-accent-800 text-xs font-semibold transition'
          : 'px-3 py-1.5 rounded-xl border border-gray-200 bg-white text-gray-600 text-xs font-medium transition';
      });

      document.getElementById('reading-timer-btn').addEventListener('click', (e) => {
        if (readingTimerId) {
          clearInterval(readingTimerId);
          readingTimerId = null;
          e.target.textContent = '继续计时';
        } else {
          e.target.textContent = '暂停';
          readingTimerId = setInterval(() => {
            if (readingSecondsLeft > 0) readingSecondsLeft--;
            const m = String(Math.floor(readingSecondsLeft / 60)).padStart(2, '0');
            const s = String(readingSecondsLeft % 60).padStart(2, '0');
            document.getElementById('reading-timer-display').textContent = `${m}:${s}`;
            if (readingSecondsLeft === 0) {
              clearInterval(readingTimerId);
              readingTimerId = null;
              showToast('本篇 9 分钟阅读计时结束');
            }
          }, 1000);
        }
      });

      // Writing mode switcher
      document.querySelectorAll('.wmode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.writingMode = btn.dataset.wmode;
          saveState();
          renderWriting();
        });
      });

      // Add SRS form
      document.getElementById('add-srs-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const word = document.getElementById('new-srs-word').value.trim();
        const meaning = document.getElementById('new-srs-meaning').value.trim();
        const note = document.getElementById('new-srs-note').value.trim();
        if (!word || !meaning) return;
        state.srsCards.unshift({
          id: 's_' + Date.now(),
          word,
          meaning,
          note,
          source: '手动录入',
          reps: 0,
          interval: 0,
          due: Date.now()
        });
        saveState();
        e.target.reset();
        renderHeaderExtras();
        renderSRS();
        showToast(`已添加 "${word}"`);
      });

      // Vocab Modal
      document.getElementById('close-vocab-modal-btn').addEventListener('click', () => {
        document.getElementById('vocab-modal').classList.add('hidden');
      });
      document.getElementById('vm-speak-btn').addEventListener('click', () => {
        if (currentVocabTarget) speakText(currentVocabTarget.word, 0.95);
      });
      document.getElementById('vm-add-srs-btn').addEventListener('click', () => {
        if (!currentVocabTarget) return;
        if (!state.srsCards.some(c => c.word.toLowerCase() === currentVocabTarget.word.toLowerCase())) {
          state.srsCards.unshift({
            id: 's_' + Date.now(),
            word: currentVocabTarget.word,
            meaning: currentVocabTarget.meaning,
            note: currentVocabTarget.tip,
            source: '阅读提取',
            reps: 0,
            interval: 0,
            due: Date.now()
          });
          saveState();
          renderHeaderExtras();
          showToast(`已将 "${currentVocabTarget.word}" 加入 SRS 词库`);
        } else {
          showToast('该词已在词库中');
        }
        document.getElementById('vocab-modal').classList.add('hidden');
      });

      // Mock Timer & Log
      document.querySelectorAll('.mock-preset').forEach(btn => {
        btn.addEventListener('click', () => {
          clearInterval(mockTimerId);
          mockTimerId = null;
          mockTotalMins = parseInt(btn.dataset.mins, 10) || 25;
          mockSecondsLeft = mockTotalMins * 60;
          document.getElementById('mock-section-label').textContent = `当前计时：${btn.dataset.label}`;
          document.getElementById('mock-timer-display').textContent = `${String(mockTotalMins).padStart(2, '0')}:00`;
          document.getElementById('mock-start-btn').textContent = '开始计时';
        });
      });

      document.getElementById('mock-start-btn').addEventListener('click', (e) => {
        if (mockTimerId) {
          clearInterval(mockTimerId);
          mockTimerId = null;
          e.target.textContent = '继续计时';
        } else {
          e.target.textContent = '暂停';
          mockTimerId = setInterval(() => {
            if (mockSecondsLeft > 0) mockSecondsLeft--;
            const m = String(Math.floor(mockSecondsLeft / 60)).padStart(2, '0');
            const s = String(mockSecondsLeft % 60).padStart(2, '0');
            document.getElementById('mock-timer-display').textContent = `${m}:${s}`;
            if (mockSecondsLeft === 0) {
              clearInterval(mockTimerId);
              mockTimerId = null;
              e.target.textContent = '开始计时';
              showToast('本模块限时结束');
            }
          }, 1000);
        }
      });

      document.getElementById('mock-reset-btn').addEventListener('click', () => {
        clearInterval(mockTimerId);
        mockTimerId = null;
        mockSecondsLeft = mockTotalMins * 60;
        document.getElementById('mock-timer-display').textContent = `${String(mockTotalMins).padStart(2, '0')}:00`;
        document.getElementById('mock-start-btn').textContent = '开始计时';
      });

      document.getElementById('mock-log-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const listen = Math.min(249, Math.max(0, parseInt(document.getElementById('mock-in-listen').value, 10) || 0));
        const read = Math.min(249, Math.max(0, parseInt(document.getElementById('mock-in-read').value, 10) || 0));
        const write = Math.min(212, Math.max(0, parseInt(document.getElementById('mock-in-write').value, 10) || 0));
        const total = listen + read + write;
        state.currentEst = { listen, read, write };
        state.mockHistory.unshift({ date: todayStr(), listen, read, write, total });
        addXP(30);
        saveState();
        renderMock();
        showToast(`模考总分 ${total} 已更新至面板`);
      });

      // Error Modal
      document.getElementById('open-add-error-btn').addEventListener('click', () => {
        document.getElementById('error-modal').classList.remove('hidden');
      });
      document.getElementById('close-error-modal-btn').addEventListener('click', () => {
        document.getElementById('error-modal').classList.add('hidden');
      });
      document.getElementById('add-error-form').addEventListener('submit', (e) => {
        e.preventDefault();
        state.errorLogs.unshift({
          id: 'e_' + Date.now(),
          pattern: document.getElementById('err-pattern').value,
          note: document.getElementById('err-note').value.trim(),
          fix: document.getElementById('err-fix').value.trim(),
          date: todayStr()
        });
        saveState();
        e.target.reset();
        document.getElementById('error-modal').classList.add('hidden');
        renderDashboard();
        showToast('错因已归档');
      });

      // Settings Modal
      document.getElementById('open-settings-btn').addEventListener('click', () => {
        document.getElementById('set-target-listen').value = state.targets.listen;
        document.getElementById('set-target-read').value = state.targets.read;
        document.getElementById('set-target-write').value = state.targets.write;
        document.getElementById('set-gamify').checked = Boolean(state.gamify);
        document.getElementById('settings-modal').classList.remove('hidden');
      });
      document.getElementById('close-settings-btn').addEventListener('click', () => {
        document.getElementById('settings-modal').classList.add('hidden');
      });
      document.getElementById('save-settings-btn').addEventListener('click', () => {
        state.targets = {
          listen: parseInt(document.getElementById('set-target-listen').value, 10) || 175,
          read: parseInt(document.getElementById('set-target-read').value, 10) || 210,
          write: parseInt(document.getElementById('set-target-write').value, 10) || 160
        };
        state.gamify = document.getElementById('set-gamify').checked;
        saveState();
        document.getElementById('settings-modal').classList.add('hidden');
        renderHeaderExtras();
        renderDashboard();
        showToast('设置已保存');
      });

      document.getElementById('export-json-btn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cet6-coach-backup-${todayStr()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('reset-demo-btn').addEventListener('click', () => {
        state = getDefaultState();
        saveState();
        document.getElementById('settings-modal').classList.add('hidden');
        renderHeaderExtras();
        switchTab('dashboard');
        showToast('已恢复初始配置');
      });

      // ---------- Init ----------
      renderHeaderExtras();
      switchTab(state.activeTab || 'dashboard');
    })();
  </script>
</body>
</html>
