<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C6 · 六级学习</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="./assets/data/reading-papers.js"></script>
  <script src="./assets/data/reading-native.js"></script>
  <script src="./assets/data/reading-answers.js?v=20261119-1"></script>
  <script src="./js/reading-ink.js?v=20261119-switch"></script>
  <script src="./js/durable-storage.js"></script>
  <script src="./js/study-core.js"></script>
  <script src="./js/language-help.js?v=20261119-database"></script>
  <script src="./js/reading-original.js?v=20261119-answers"></script>
  <link rel="stylesheet" href="./assets/reading.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F6F8FA',
            ink: '#293744',
            muted: '#788591',
            accent: {
              50: '#EFF4F8',
              100: '#E1EAF2',
              200: '#CAD8E4',
              300: '#B4C7D8',
              400: '#9BB4C9',
              500: '#829EB7',
              600: '#7D9BB5',
              700: '#536F88',
              800: '#425F78',
              900: '#344E65'
            }
          },
          fontFamily: {
            sans: ['Inter', '"Noto Sans SC"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="./assets/coach.css" />
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Navigation -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 shrink-0">
        <div class="w-8 h-8 rounded-lg bg-accent-700 text-white font-mono font-semibold text-sm flex items-center justify-center tracking-tight">C6</div>
        <div class="leading-tight">
          <div class="text-sm font-bold text-ink">六级学习</div>
        </div>
      </div>

      <nav id="main-nav" class="flex items-center gap-1 overflow-x-auto no-scrollbar py-1">
        <button type="button" data-tab="dashboard" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">面板</button>
        <button type="button" data-tab="listening" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">精听</button>
        <button type="button" data-tab="reading" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">阅读</button>
        <button type="button" data-tab="writing" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">写译</button>
        <button type="button" data-tab="srs" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">词库 <span id="nav-srs-badge" class="ml-1 px-1.5 py-0.5 text-[10px] rounded-full bg-accent-50 text-accent-700 font-mono">0</span></button>
        <button type="button" data-tab="mock" class="nav-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition">模考</button>
      </nav>

      <div class="flex items-center gap-2 shrink-0">
        <span id="live-timer-pill" class="text-xs text-muted font-mono">0m</span>
        <span id="gamify-pill" class="hidden text-xs font-mono px-2.5 py-1 rounded-full bg-accent-50 text-accent-800 border border-accent-100">Lv.1 · 0 XP</span>
        <button type="button" id="open-settings-btn" class="px-2.5 py-1.5 rounded-lg border border-gray-200 text-xs font-medium text-gray-700 hover:bg-gray-50 transition">设置</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-6 py-5 space-y-5">

    <!-- ==================== TAB 1: DASHBOARD ==================== -->
    <section id="view-dashboard" class="tab-view space-y-5">
      <div class="dashboard-top">
        <div class="study-start">
          <div class="hero-heading">
            <h1>今日学习</h1>
            <span id="countdown-pill"></span>
          </div>
          <div id="energy-switcher" class="duration-switch">
            <button type="button" data-energy="10m" class="energy-btn">10 分钟</button>
            <button type="button" data-energy="20m" class="energy-btn">20 分钟</button>
            <button type="button" data-energy="35m" class="energy-btn">35 分钟</button>
          </div>
          <div id="today-mission-box" class="study-action">
            <span id="mission-title"></span>
            <button type="button" id="start-mission-btn">开始学习 <span aria-hidden="true">↗</span></button>
          </div>
          <a class="practice-link" href="./listening.html">真题精听 <span aria-hidden="true">→</span></a>
        </div>
        <aside class="progress-panel">
          <div class="progress-heading"><h2>学习记录</h2><span id="checkin-status-badge"></span></div>
          <div class="progress-stats">
            <div><strong id="stat-streak">0</strong><span>连续天数</span></div>
            <div><strong id="stat-est-total">489</strong><span>当前估分</span></div>
            <div><strong id="stat-today-mins">0m</strong><span>今日专注</span></div>
          </div>
          <div id="streak-grid" class="streak-grid"></div>
        </aside>
      </div>

      <!-- Today's Study Review Card (New: Auto-tracked content + time + AI review) -->
      <div class="card p-5 sm:p-6 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="text-base font-bold text-ink mt-0.5">今日记录</h2>
          </div>
          <button type="button" id="ai-daily-review-btn" class="px-3.5 py-1.5 rounded-xl bg-accent-700 hover:bg-accent-800 text-white text-xs font-semibold transition">AI 复盘</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
          <div class="md:col-span-5 space-y-2" id="today-module-bars"></div>
          <div class="md:col-span-7 space-y-2">
            <div class="text-xs font-semibold text-gray-700">学习明细</div>
            <div id="today-activity-list" class="space-y-1.5 max-h-36 overflow-y-auto text-xs"></div>
          </div>
        </div>
        <div id="ai-daily-review-box" class="hidden rounded-xl bg-accent-50/70 border border-accent-100 p-4 text-xs leading-relaxed text-accent-900"></div>
      </div>

      <!-- Score Chart + Error Log -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
        <div class="lg:col-span-5 card p-5 sm:p-6 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-base font-bold text-ink mt-0.5">分数进度</h2>
            </div>
            <span id="target-badge" class="text-xs font-mono px-2.5 py-1 rounded-full bg-gray-100 text-gray-800">目标 545+</span>
          </div>
          <div class="relative h-60">
            <canvas id="score-chart"></canvas>
          </div>
        </div>

        <div class="lg:col-span-7 card p-5 sm:p-6 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h2 class="text-base font-bold text-ink mt-0.5">错题记录</h2>
            </div>
            <button type="button" id="open-add-error-btn" class="px-3 py-1.5 rounded-xl border border-gray-200 text-xs font-medium text-ink hover:bg-gray-50 transition">+ 记录错因</button>
          </div>
          <div id="error-filter-bar" class="flex flex-wrap gap-1.5"></div>
          <div id="error-list" class="space-y-2.5 max-h-56 overflow-y-auto pr-1"></div>
        </div>
      </div>
    </section>

    <!-- ==================== TAB 2: INTEGRATED CET-6 INTENSIVE LISTENING ==================== -->
    <section id="view-listening" class="tab-view hidden space-y-5">
      <div class="card p-5 sm:p-6 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-bold text-ink mt-0.5">真题精听</h2>
          </div>
          <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
            <select id="listening-exam-select" class="flex-1 sm:flex-none px-3 py-2 rounded-xl border border-gray-200 text-xs sm:text-sm bg-white text-ink"></select>
            <select id="listening-section-select" class="flex-1 sm:flex-none px-3 py-2 rounded-xl border border-gray-200 text-xs sm:text-sm bg-white text-ink"></select>
          </div>
        </div>

        <!-- Real Audio Player Bar -->
        <div class="rounded-xl bg-paper border border-gray-200 p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span id="listening-source-badge" class="text-xs font-mono text-accent-800 font-semibold">正在加载真题索引...</span>
            <div class="flex items-center gap-2">
              <button type="button" id="play-section-btn" class="px-3 py-1.5 rounded-lg bg-accent-700 hover:bg-accent-800 text-white text-xs font-semibold">▶ 播放本篇章</button>
              <select id="listening-speed-select" class="px-2.5 py-1.5 rounded-lg border border-gray-200 text-xs font-mono bg-white text-ink">
                <option value="0.75">0.75x</option>
                <option value="0.9">0.90x</option>
                <option value="1" selected>1.00x</option>
                <option value="1.15">1.15x</option>
              </select>
            </div>
          </div>
          <audio id="listening-audio" controls playsinline preload="metadata" class="w-full h-10"></audio>
        </div>

        <div class="inline-flex rounded-xl bg-gray-100 p-1 gap-1" id="listening-step-tabs">
          <button type="button" data-lstep="blind" class="lstep-btn px-3 py-1.5 rounded-lg text-xs font-medium transition">1. 盲听答题</button>
          <button type="button" data-lstep="dictation" class="lstep-btn px-3 py-1.5 rounded-lg text-xs font-medium transition">2. 逐句听写</button>
          <button type="button" data-lstep="transcript" class="lstep-btn px-3 py-1.5 rounded-lg text-xs font-medium transition">3. 原文与译文</button>
        </div>

        <div id="listening-content" class="space-y-4 lookup-zone"></div>
      </div>
    </section>

    <!-- ==================== TAB 3: READING LAB ==================== -->
    <section id="view-reading" class="tab-view hidden space-y-5">
      <div id="original-reading-app"></div>
    </section>

    <!-- ==================== TAB 4: WRITING & TRANSLATION + AI GRADING ==================== -->
    <section id="view-writing" class="tab-view hidden space-y-5">
      <div class="card p-5 sm:p-6 space-y-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-bold text-ink mt-0.5">写作与翻译</h2>
          </div>
          <div class="inline-flex rounded-xl bg-gray-100 p-1 gap-1" id="writing-mode-tabs">
            <button type="button" data-wmode="upgrade" class="wmode-btn px-3 py-1.5 rounded-lg text-xs font-medium transition">真题写作 (6套)</button>
            <button type="button" data-wmode="translation" class="wmode-btn px-3 py-1.5 rounded-lg text-xs font-medium transition">段落汉译英 (6套)</button>
          </div>
        </div>

        <div id="writing-content" class="space-y-4 lookup-zone"></div>
      </div>
    </section>

    <!-- ==================== TAB 5: 3207 WORD IMAGERY + SYNONYM NUANCE + WORDBOOK ==================== -->
    <section id="view-srs" class="tab-view hidden space-y-5">
      <div class="card p-5 sm:p-6 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="text-xl font-bold text-ink mt-0.5">单词意象</h2>
          </div>
          <span id="wordbank-status-pill" class="text-xs font-mono px-2.5 py-1 rounded-full bg-accent-50 text-accent-800 border border-accent-100">正在同步 3,207 词库...</span>
        </div>

        <div class="relative max-w-xl">
          <div class="flex gap-2">
            <input type="text" id="imagery-search-input" placeholder="搜索单词" class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-accent-600" autocomplete="off" />
            <button type="button" id="imagery-search-btn" class="px-5 py-2.5 rounded-xl bg-accent-700 hover:bg-accent-800 text-white text-xs font-semibold transition">解释</button>
          </div>
          <div id="imagery-suggest-box" class="hidden absolute left-0 right-0 top-12 z-20 bg-white rounded-xl border border-gray-200 shadow-lg max-h-64 overflow-y-auto divide-y divide-gray-100"></div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
        <!-- Left: Full 6-part Word Imagery Card + Clickable Synonym Nuances + SRS -->
        <div class="lg:col-span-7 card p-5 sm:p-6">
          <div id="srs-card-stage" class="rounded-2xl border border-gray-200 bg-paper p-5 sm:p-6 min-h-[420px] flex flex-col justify-between"></div>
        </div>

        <!-- Right: User's Saved Wordbook (Manual add form removed as requested) -->
        <div class="lg:col-span-5 card p-5 sm:p-6 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-base font-bold text-ink">我的单词本</h3>
            </div>
            <span id="srs-queue-count" class="text-xs font-mono text-accent-700">待复习 0</span>
          </div>
          <div class="flex gap-2">
            <button type="button" id="wb-filter-due" class="px-3 py-1 rounded-lg text-xs font-semibold bg-ink text-white">今日待复习</button>
            <button type="button" id="wb-filter-all" class="px-3 py-1 rounded-lg text-xs font-medium bg-gray-100 text-gray-600">全部收藏</button>
            <button type="button" id="srs-review-all-btn" class="ml-auto px-3 py-1 rounded-lg border border-gray-200 text-xs text-gray-600 hover:bg-gray-50">重置复习队列</button>
          </div>
          <div id="srs-word-list" class="space-y-1.5 max-h-[380px] overflow-y-auto text-xs pr-1"></div>
        </div>
      </div>
    </section>

    <!-- ==================== TAB 6: DEC 5 FULL REAL PAPER MOCK ==================== -->
    <section id="view-mock" class="tab-view hidden space-y-5">
      <div class="card p-5 sm:p-6 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="text-xl font-bold text-ink mt-0.5">模拟练习</h2>
          </div>
          <div class="flex items-center gap-2">
            <div class="px-3 py-1.5 rounded-xl bg-paper border border-gray-200 font-mono text-base font-bold text-ink tabular-nums" id="mock-timer-display">30:00</div>
            <button type="button" id="mock-start-btn" class="px-4 py-2 rounded-xl bg-accent-700 hover:bg-accent-800 text-white text-xs font-semibold">开始计时</button>
            <button type="button" id="mock-reset-btn" class="px-3 py-2 rounded-xl border border-gray-200 bg-white text-xs font-medium text-gray-700">重置</button>
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-gray-100">
          <div class="inline-flex rounded-xl bg-gray-100 p-1 gap-1 overflow-x-auto max-w-full" id="mock-part-tabs">
            <button type="button" data-mpart="part1" data-mins="30" class="mpart-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Part I 写作 (30m)</button>
            <button type="button" data-mpart="part2" data-mins="25" class="mpart-btn px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap">Part II 听力 (25m)</button>
            <button type="button" data-mpart="part3" data-mins="40" class="mpart-btn px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap">Part III 阅读 (40m)</button>
            <button type="button" data-mpart="part4" data-mins="30" class="mpart-btn px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap">Part IV 翻译 (30m)</button>
          </div>
          <button type="button" id="submit-full-mock-btn" class="px-4 py-2 rounded-xl bg-ink hover:bg-gray-800 text-white text-xs font-semibold">保存作答</button>
        </div>

        <div id="mock-paper-workspace" class="pt-2 lookup-zone"></div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
        <div class="lg:col-span-6 card p-5 sm:p-6 space-y-4">
          <h3 class="text-base font-bold text-ink">录入成绩</h3>
          <form id="mock-log-form" class="grid grid-cols-3 gap-3">
            <div>
              <label class="text-[11px] text-muted block mb-1">听力 (0-249)</label>
              <input type="number" id="mock-in-listen" min="0" max="249" value="155" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm font-mono" />
            </div>
            <div>
              <label class="text-[11px] text-muted block mb-1">阅读 (0-249)</label>
              <input type="number" id="mock-in-read" min="0" max="249" value="205" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm font-mono" />
            </div>
            <div>
              <label class="text-[11px] text-muted block mb-1">写译 (0-212)</label>
              <input type="number" id="mock-in-write" min="0" max="212" value="152" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm font-mono" />
            </div>
            <button type="submit" class="col-span-3 py-2.5 rounded-xl bg-accent-700 hover:bg-accent-800 text-white text-xs font-semibold">记录本次模考并更新面板估分</button>
          </form>
        </div>

        <div class="lg:col-span-6 card p-5 sm:p-6 space-y-4">
          <h3 class="text-base font-bold text-ink">历史记录</h3>
          <div id="mock-history-list" class="space-y-2 max-h-36 overflow-y-auto text-xs"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Settings & Dual-Compatible AI Modal -->
  <div id="settings-modal" class="fixed inset-0 z-50 hidden bg-black/30 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-gray-200 max-w-xl w-full p-5 sm:p-6 space-y-5 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-lg font-bold text-ink">学习设置</h3>
        </div>
        <button type="button" id="close-settings-btn" class="w-8 h-8 rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50">✕</button>
      </div>

      <!-- Dual-Compatible AI Config -->
      <div class="rounded-xl bg-paper border border-gray-200 p-4 space-y-3 text-xs">
        <div class="font-bold text-ink">AI 设置</div>
        <div class="flex gap-3">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="radio" name="ai-mode" value="direct" id="ai-mode-direct" class="accent-slate-500" />
            <span>API Key</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="radio" name="ai-mode" value="worker" id="ai-mode-worker" class="accent-slate-500" />
            <span>代理接口</span>
          </label>
        </div>

        <div id="ai-direct-fields" class="space-y-2">
          <input type="url" id="set-ai-baseurl" placeholder="API 地址（默认 https://api.deepseek.com/chat/completions）" class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white font-mono text-xs" />
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="set-ai-model" placeholder="模型（默认 deepseek-chat）" class="px-3 py-2 rounded-xl border border-gray-200 bg-white font-mono text-xs" />
            <input type="password" id="set-ai-key" placeholder="sk-... (仅存本机)" class="px-3 py-2 rounded-xl border border-gray-200 bg-white font-mono text-xs" />
          </div>
        </div>

        <button type="button" id="test-ai-btn" class="px-3 py-2 rounded-lg bg-accent-50 text-accent-800">测试连接</button>
        <p id="ai-test-result" class="text-xs text-muted" role="status"></p>
        <div id="ai-worker-fields" class="hidden space-y-2">
          <input type="url" id="set-worker-url" placeholder="https://lingosu.online/cet6-listening-ai/api/analyze" class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-white font-mono text-xs" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 text-xs">
        <div>
          <label class="text-muted block mb-1">听力目标 (满分249)</label>
          <input type="number" id="set-target-listen" min="100" max="249" class="w-full px-3 py-2 rounded-xl border border-gray-200 font-mono" />
        </div>
        <div>
          <label class="text-muted block mb-1">阅读目标 (满分249)</label>
          <input type="number" id="set-target-read" min="100" max="249" class="w-full px-3 py-2 rounded-xl border border-gray-200 font-mono" />
        </div>
        <div>
          <label class="text-muted block mb-1">写译目标 (满分212)</label>
          <input type="number" id="set-target-write" min="80" max="212" class="w-full px-3 py-2 rounded-xl border border-gray-200 font-mono" />
        </div>
        <div class="flex items-end">
          <label class="flex items-center gap-2 cursor-pointer p-2 rounded-xl border border-gray-200 w-full">
            <input type="checkbox" id="set-gamify" class="accent-slate-500 w-4 h-4" />
            <span class="font-medium text-ink">开启积分等级</span>
          </label>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-gray-100">

      function logStudyActivity(label) {
        lastActivityTs = Date.now();
        const log = ensureTodayLog();
        if (!log.items.includes(label)) {
          log.items.unshift(label);
          if (log.items.length > 20) log.items.pop();
        }
        if (!state.checkedDates.includes(todayStr())) {
          state.checkedDates.push(todayStr());
        }
        saveState();
      }

      function startAutoStudyTimer() {
        ['touchstart', 'click', 'keydown', 'input', 'scroll'].forEach(evt => {
          window.addEventListener(evt, () => { lastActivityTs = Date.now(); }, { passive: true });
        });

        setInterval(() => {
          if (document.hidden) return;
          if (Date.now() - lastActivityTs > 120000) return; // Pause if idle > 2 min
          const log = ensureTodayLog();
          log.totalSec = (log.totalSec || 0) + 1;
          const tab = state.activeTab || 'dashboard';
          log.byTab[tab] = (log.byTab[tab] || 0) + 1;

          // Auto check-in once active >= 60s
          if (log.totalSec >= 60 && !state.checkedDates.includes(todayStr())) {
            state.checkedDates.push(todayStr());
          }
          const mins = Math.floor(log.totalSec / 60);
          document.getElementById('live-timer-pill').textContent = `今日 ${mins}m`;
          if (log.totalSec % 10 === 0) {
            saveState();
            if (state.activeTab === 'dashboard') {
              const mEl = document.getElementById('stat-today-mins');
              if (mEl) mEl.textContent = `${mins}m`;

        }, 1000);

      async function loadListeningExam(examId, basePrefix = 'https://chenxianq16.github.io/-/') {

      // ---------- 6. Word Lookup & Mobile Long-Press Engine ----------
      function lookupWordEntry(raw) {
        if (!raw) return null;
        const clean = window.C6StudyCore.normalizeWord(raw);
        if (!clean || clean.length < 2) return null;
        if (wordImageryMap.has(clean)) return wordImageryMap.get(clean);
        if(clean.includes(' '))return null;
        // Basic inflection stripping
        const candidates = [
          clean.replace(/ies$/, 'y'),
          clean.replace(/es$/, ''),
          clean.replace(/s$/, ''),
          clean.replace(/ied$/, 'y'),
          clean.replace(/ed$/, ''),
          clean.replace(/ed$/, 'e'),
          clean.replace(/ing$/, ''),
          clean.replace(/ing$/, 'e'),
          clean.replace(/ly$/, '')
        ];
        for (const c of candidates) {
          if (wordImageryMap.has(c)) return wordImageryMap.get(c);
        }
        return null;
      }

      function getWordAtPoint(x, y) {
        let range = null;
        if (document.caretRangeFromPoint) {
          range = document.caretRangeFromPoint(x, y);
        } else if (document.caretPositionFromPoint) {
          const pos = document.caretPositionFromPoint(x, y);
          if (pos) {
            range = document.createRange();
            range.setStart(pos.offsetNode, pos.offset);
          }
        }
        if (!range || !range.startContainer || range.startContainer.nodeType !== 3) return '';
        const text = range.startContainer.textContent || '';
        let start = range.startOffset;
        let end = range.startOffset;
        while (start > 0 && /[a-zA-Z'-]/.test(text[start - 1])) start--;
        while (end < text.length && /[a-zA-Z'-]/.test(text[end])) end++;
        return text.slice(start, end);
      }

      function bindGlobalLongPressLookup() {
        let timer=null,x=0,y=0,target=null,blocked=null,blockedUntil=0;
        const clear=()=>{clearTimeout(timer);timer=null;};
        document.addEventListener('pointerdown',e=>{
          clear();const zone=e.target.closest('.lookup-zone');
          if(!zone||e.target.closest('input,textarea,button,select,.native-ink,.native-toolbar')||e.button>0)return;
          x=e.clientX;y=e.clientY;target=e.target;
          timer=setTimeout(()=>{timer=null;const word=getWordAtPoint(x,y);if(word?.length>=2){blocked=target.closest('.native-option')||target;blockedUntil=Date.now()+1000;openWordLookupModal(word);}},450);
        });
        document.addEventListener('pointermove',e=>{if(timer&&(Math.abs(e.clientX-x)>10||Math.abs(e.clientY-y)>10))clear();});
        document.addEventListener('pointerup',clear);document.addEventListener('pointercancel',clear);window.addEventListener('scroll',clear,true);
        document.addEventListener('click',e=>{if(blocked&&Date.now()<blockedUntil&&blocked.contains(e.target)){e.preventDefault();e.stopImmediatePropagation();blocked=null;}},true);
        document.addEventListener('dblclick',e=>{
          if(!e.target.closest('.lookup-zone')||e.target.closest('input,textarea,button,select,.native-ink'))return;
          const selected=window.getSelection?.().toString().trim();if(selected&&/^[a-zA-Z'-]+$/.test(selected))openWordLookupModal(selected);
        });
      }

      let wordLookupToken=0;
      async function openWordLookupModal(rawWord) {
        const word=String(rawWord).toLowerCase().replace(/[^a-z'-]/g,'');if(word.length<2)return;
        const token=++wordLookupToken,modal=document.getElementById('vocab-modal'),add=document.getElementById('vm-add-srs-btn'),retry=document.getElementById('vm-retry');
        currentModalWord=null;add.disabled=true;retry.hidden=true;
        document.getElementById('vm-word').textContent=word;
        document.getElementById('vm-source').textContent='';
        for(const id of ['vm-imagery','vm-ext','vm-meaning','vm-lost','vm-synonyms']){const el=document.getElementById(id);el.replaceChildren();el.classList.remove('hidden');}
        document.getElementById('vm-imagery').textContent='正在查询…';document.getElementById('vm-lost').classList.add('hidden');modal.classList.remove('hidden');
        let entry=lookupWordEntry(word);
        try{
          if(!entry)entry=await window.C6LanguageHelp.lookupDictionary(word);
          if(token!==wordLookupToken||modal.classList.contains('hidden'))return;
          currentModalWord=entry;add.disabled=false;
          document.getElementById('vm-source').textContent=entry.kind==='dictionary'?`普通释义 · ${entry.source}`:'单词意象';
          document.getElementById('vm-imagery').textContent=entry.kind==='dictionary'?'':entry.i;
          const ext=document.getElementById('vm-ext');for(const definition of entry.s||[]){const div=document.createElement('div');div.textContent='• '+definition;ext.append(div);}
          const meaning=document.getElementById('vm-meaning');for(const definition of entry.c||[]){const span=document.createElement('span');span.className='px-2 py-0.5 rounded-full bg-accent-50 text-accent-800 border border-accent-100 text-xs';span.textContent=definition;meaning.append(span);}
          const lost=document.getElementById('vm-lost');if(entry.l){lost.textContent='语感：'+entry.l;lost.classList.remove('hidden');}
          const wrap=document.getElementById('vm-synonyms'),syns=SYNONYM_NUANCES[entry.w.toLowerCase()]||state.aiSynonymCache[entry.w.toLowerCase()]||[];
          for(const syn of syns){const btn=document.createElement('button');btn.type='button';btn.className='vm-syn-jump w-full text-left px-3 py-1.5 rounded-lg bg-paper border border-gray-200 text-xs';btn.textContent=syn.w+'：'+syn.diff;btn.onclick=()=>openWordLookupModal(syn.w);wrap.append(btn);}
        }catch(e){if(token!==wordLookupToken||modal.classList.contains('hidden'))return;document.getElementById('vm-imagery').textContent=e.message||'词典暂不可用';retry.hidden=false;retry.onclick=()=>openWordLookupModal(word);}
      }

      function computeStreak() {
        const set = new Set(state.checkedDates || []);
        let streak = 0;
        const d = new Date();
        if (!set.has(todayStr())) d.setDate(d.getDate() - 1);
        while (true) {
          const s = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
          if (set.has(s)) { streak++; d.setDate(d.getDate() - 1); } else break;
        }
        return streak;
      }

      function playAudioSegment(startSec, endSec, fallbackText) {
        const audio = document.getElementById('listening-audio');
        const rate = parseFloat(document.getElementById('listening-speed-select').value) || 1;
        if (currentListeningExam.resolvedAudioUrl && audio.src) {
          clearInterval(sectionStopMonitor);
          audio.playbackRate = rate;
          if (typeof startSec === 'number') audio.currentTime = startSec;
          audio.play().catch(() => speakText(fallbackText, rate));
          if (typeof endSec === 'number') {
            sectionStopMonitor = setInterval(() => {
              if (audio.currentTime >= endSec) {
                audio.pause();
                clearInterval(sectionStopMonitor);
              }
            }, 150);
          }
        } else {
          speakText(fallbackText, rate);
        }

          ws.innerHTML = `
            <div class="p-4 sm:p-5 rounded-xl bg-paper border border-gray-200 space-y-3">
              <div class="text-xs font-bold text-accent-800">Part IV Translation (30 minutes) · ${tTask.title}</div>
              <p class="text-sm leading-7 text-ink bg-white p-4 rounded-xl border border-gray-200">${tTask.chinese}</p>
              <textarea id="mock-trans-area" rows="5" class="w-full rounded-xl border border-gray-200 p-3 text-sm bg-white" placeholder="输入北斗翻译作答...">${state.mockAnswers.transText || ''}</textarea>
            </div>
          `;
          ws.querySelector('#mock-trans-area').addEventListener('input', (e) => { state.mockAnswers.transText = e.target.value; saveState(); });
        }

        // Diagnostic & History
        const histEl = document.getElementById('mock-history-list');
        histEl.innerHTML = state.mockHistory.length
          ? state.mockHistory.map(m => `<div class="flex justify-between p-2.5 rounded-lg bg-paper border border-gray-200"><span class="font-mono text-muted">${m.date}</span><span>听${m.listen}/阅${m.read}/写译${m.write}</span><strong class="font-mono text-accent-700">${m.total}</strong></div>`).join('')
          : '<div class="text-muted text-center py-3">尚无模考记录</div>';
      }

      // ---------- Event Listeners ----------
      document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
      document.querySelectorAll('.energy-btn').forEach(btn => btn.addEventListener('click', () => { state.energyMode = btn.dataset.energy; saveState(); renderDashboard(); }));

      // Listening controls
      document.getElementById('listening-exam-select').addEventListener('change', (e) => loadListeningExam(e.target.value));
      document.getElementById('listening-section-select').addEventListener('change', (e) => { state.listeningSectionIdx = parseInt(e.target.value, 10) || 0; saveState(); renderListening(); });
      document.querySelectorAll('.lstep-btn').forEach(btn => btn.addEventListener('click', () => { state.listeningStep = btn.dataset.lstep; saveState(); renderListening(); }));
      document.getElementById('play-section-btn').addEventListener('click', () => {
        const sec = (currentListeningExam.sections || [])[state.listeningSectionIdx];
        if (!sec) return;
        playAudioSegment(sec.start, sec.end, (sec.sentences || []).map(s => s.text).join(' '));
        logStudyActivity(`精听播放：${sec.title}`);
      });

      // Writing switcher
      document.querySelectorAll('.wmode-btn').forEach(btn => btn.addEventListener('click', () => { state.writingMode = btn.dataset.wmode; saveState(); renderWriting(); }));

      // Word Imagery Search
      const searchInput = document.getElementById('imagery-search-input');
      const suggestBox = document.getElementById('imagery-suggest-box');
      async function resolveWord(raw) {
        const normalized=window.C6StudyCore.normalizeWord(raw);
        const known=lookupWordEntry(normalized);if(known)return known;
        const definition=await window.C6LanguageHelp.lookupDictionary(normalized);
        const arrived=lookupWordEntry(normalized);if(arrived)return arrived;
        wordImageryMap.set(normalized,definition);wordImageryBank.push(definition);
        state.personalImagery ||= [];if(!state.personalImagery.some(x=>window.C6StudyCore.normalizeWord(x.w)===normalized))state.personalImagery.push(definition);
        saveState();return definition;
      }
      async function jumpToWord(q) {
        const normalized=window.C6StudyCore.normalizeWord(q);if(!normalized)return;
        state.selectedWord=normalized;srsFlipped=true;suggestBox.classList.add('hidden');saveState();renderSRS();
      }

      searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) { suggestBox.classList.add('hidden'); return; }
        const matches = wordImageryBank.filter(c => c.w.toLowerCase().startsWith(q) || c.w.toLowerCase().includes(q) || c.i.includes(q)).slice(0, 8);
        if (!matches.length) { suggestBox.classList.add('hidden'); return; }
        suggestBox.innerHTML = matches.map(m => `<button type="button" class="sug-item w-full text-left px-4 py-2.5 hover:bg-accent-50/60 flex justify-between gap-2 text-xs" data-w="${m.w}"><strong class="text-ink">${m.w}</strong><span class="text-muted truncate">${m.i}</span></button>`).join('');
        suggestBox.querySelectorAll('.sug-item').forEach(b => b.addEventListener('click', () => { searchInput.value = b.dataset.w; jumpToWord(b.dataset.w); }));
        suggestBox.classList.remove('hidden');
      });
      searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); jumpToWord(searchInput.value); } });
      document.getElementById('imagery-search-btn').addEventListener('click', () => jumpToWord(searchInput.value));

      // Wordbook filter buttons
      document.getElementById('wb-filter-due').addEventListener('click', () => { state.wordbookFilter = 'due'; saveState(); renderSRS(); });
      document.getElementById('wb-filter-all').addEventListener('click', () => { state.wordbookFilter = 'all'; saveState(); renderSRS(); });
      document.getElementById('srs-review-all-btn').addEventListener('click', () => {
        state.wordbook.forEach(c => { c.due = Date.now(); });
        saveState(); renderHeaderExtras(); renderSRS(); showToast('已重置单词本复习队列');
      });

      // Vocab Modal buttons
      document.getElementById('close-vocab-modal-btn').addEventListener('click', () => document.getElementById('vocab-modal').classList.add('hidden'));
      document.getElementById('vm-speak-btn').addEventListener('click', () => { if (currentModalWord) speakText(currentModalWord.w, 0.95); });
      document.getElementById('vm-add-srs-btn').addEventListener('click', () => {
        if (!currentModalWord) return;
        if(currentModalWord.kind === 'dictionary') {
          wordImageryMap.set(currentModalWord.w.toLowerCase(),currentModalWord);
          if(!wordImageryBank.some(x=>x.w===currentModalWord.w))wordImageryBank.push(currentModalWord);
          state.personalImagery ||= [];
          if(!state.personalImagery.some(x=>x.w===currentModalWord.w))state.personalImagery.push(currentModalWord);
        }
        const exists = state.wordbook.find(x => x.word.toLowerCase() === currentModalWord.w.toLowerCase());
        if (!exists) {
          state.wordbook.unshift({ word: currentModalWord.w, source: '长按抓词', reps: 0, interval: 0, due: Date.now() });
          logStudyActivity(`长按收录生词：${currentModalWord.w}`);
          saveState(); renderHeaderExtras();
          showToast(`已将 "${currentModalWord.w}" 加入单词本`);
        } else {
          exists.due = Date.now();
          saveState();
          showToast(`"${currentModalWord.w}" 已置顶到今日待复习`);
        }
        document.getElementById('vocab-modal').classList.add('hidden');
      });

      // AI Daily Review
      document.getElementById('ai-daily-review-btn').addEventListener('click', async (e) => {
        const log = ensureTodayLog();
        const mins = Math.floor((log.totalSec || 0) / 60);
        const box = document.getElementById('ai-daily-review-box');
        const btn = e.target;
        btn.disabled = true; btn.textContent = '复盘生成中...';
        try {
          const reply = await callDualAi(
            '你是 CET-6 学习教练。根据学习者今日实际用时和完成内容，给出100字以内的明日最小可执行建议。',
            `今日专注时长：${mins} 分钟；完成记录：${(log.items || []).join('；') || '刚打开网页'}；四级基线：听140/阅200/写译149。`
          );
          box.textContent = typeof reply === 'string' ? reply : JSON.stringify(reply);
          box.classList.remove('hidden');
        } catch (err) {
          box.textContent = `本地复盘：今日累计专注 ${mins} 分钟，已完成 ${(log.items || []).length} 项记录。若尚未配置 AI Key，可在右上角「设置」填入后获取个性化 AI 复盘。`;
          box.classList.remove('hidden');
        } finally {
          btn.disabled = false; btn.textContent = 'AI 复盘';
        }
      });

      // Mock controls
      document.querySelectorAll('.mpart-btn').forEach(btn => btn.addEventListener('click', () => {
        state.mockPart = btn.dataset.mpart;
        clearInterval(mockTimerId); mockTimerId = null;
        mockTotalMins = parseInt(btn.dataset.mins, 10) || 30;
        mockSecondsLeft = mockTotalMins * 60;
        document.getElementById('mock-timer-display').textContent = `${String(mockTotalMins).padStart(2, '0')}:00`;
        document.getElementById('mock-start-btn').textContent = '开始计时';
        saveState(); renderMock();
      }));
      document.getElementById('mock-start-btn').addEventListener('click', (e) => {
        if (mockTimerId) { clearInterval(mockTimerId); mockTimerId = null; e.target.textContent = '继续'; }
        else {
          e.target.textContent = '暂停';
          mockTimerId = setInterval(() => {
            if (mockSecondsLeft > 0) mockSecondsLeft--;
            document.getElementById('mock-timer-display').textContent = `${String(Math.floor(mockSecondsLeft / 60)).padStart(2, '0')}:${String(mockSecondsLeft % 60).padStart(2, '0')}`;
            if (mockSecondsLeft === 0) { clearInterval(mockTimerId); mockTimerId = null; showToast('计时结束'); }
          }, 1000);
        }
      });
      document.getElementById('mock-reset-btn').addEventListener('click', () => {
        clearInterval(mockTimerId); mockTimerId = null;
        mockSecondsLeft = mockTotalMins * 60;
        document.getElementById('mock-timer-display').textContent = `${String(mockTotalMins).padStart(2, '0')}:00`;
        document.getElementById('mock-start-btn').textContent = '开始计时';
      });
      document.getElementById('submit-full-mock-btn').addEventListener('click', () => {
        saveState();
        logStudyActivity('保存模拟作答');
        showToast('作答已保存；核对原卷答案后可录入成绩');
      });
      document.getElementById('mock-log-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const listen = parseInt(document.getElementById('mock-in-listen').value, 10) || 0;
        const read = parseInt(document.getElementById('mock-in-read').value, 10) || 0;
        const write = parseInt(document.getElementById('mock-in-write').value, 10) || 0;
        const total = listen + read + write;
        state.currentEst = { listen, read, write };
        state.mockHistory.unshift({ date: todayStr(), listen, read, write, total });
        logStudyActivity(`录入模考分：${total} 分`);
        saveState(); renderMock(); showToast(`模考分 ${total} 已更新`);
      });

      // Error Modal
      document.getElementById('open-add-error-btn').addEventListener('click', () => document.getElementById('error-modal').classList.remove('hidden'));
      document.getElementById('close-error-modal-btn').addEventListener('click', () => document.getElementById('error-modal').classList.add('hidden'));
      document.getElementById('add-error-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        state.errorLogs.unshift({ id: 'e_' + Date.now(), pattern: document.getElementById('err-pattern').value, note: document.getElementById('err-note').value.trim(), fix: document.getElementById('err-fix').value.trim(), date: todayStr() });
        if(!await saveState()){state.errorLogs.shift();return;} e.target.reset(); document.getElementById('error-modal').classList.add('hidden'); renderDashboard(); showToast('错因已归档');
      });

      // Settings Modal
      function syncAiModeUI(mode) {
        document.getElementById('ai-direct-fields').classList.toggle('hidden', mode !== 'direct');
        document.getElementById('ai-worker-fields').classList.toggle('hidden', mode !== 'worker');
      }
      document.getElementById('ai-mode-direct').addEventListener('change', () => syncAiModeUI('direct'));
      document.getElementById('ai-mode-worker').addEventListener('change', () => syncAiModeUI('worker'));

      document.getElementById('test-ai-btn').onclick=async()=>{
        const btn=document.getElementById('test-ai-btn'),result=document.getElementById('ai-test-result');
        const cfg={mode:document.getElementById('ai-mode-worker').checked?'worker':'direct',baseUrl:document.getElementById('set-ai-baseurl').value,model:document.getElementById('set-ai-model').value,apiKey:document.getElementById('set-ai-key').value.trim(),workerUrl:document.getElementById('set-worker-url').value};
        btn.disabled=true;result.textContent='正在测试…';
        try{await window.C6StudyCore.requestAi(cfg,'Reply OK.','Connection test.',{type:'word',word:'test'},true);result.textContent='连接成功';if(/\/api\/analyze\/?$/.test(cfg.baseUrl.trim())){document.getElementById('ai-mode-worker').checked=true;document.getElementById('set-worker-url').value=cfg.baseUrl.trim();syncAiModeUI('worker');}else if(cfg.mode==='direct')document.getElementById('set-ai-baseurl').value=window.C6StudyCore.endpoint(cfg.baseUrl);}
        catch(e){result.textContent=e.message;}finally{btn.disabled=false;}
      };
      document.getElementById('open-settings-btn').addEventListener('click', () => {
        document.getElementById('ai-mode-direct').checked = state.aiConfig.mode === 'direct';
        document.getElementById('ai-mode-worker').checked = state.aiConfig.mode === 'worker';
        syncAiModeUI(state.aiConfig.mode);
        document.getElementById('set-ai-baseurl').value = state.aiConfig.baseUrl || '';
        document.getElementById('set-ai-model').value = state.aiConfig.model || '';
        document.getElementById('set-ai-key').value = state.aiConfig.apiKey || '';
        document.getElementById('set-worker-url').value = state.aiConfig.workerUrl || '';
        document.getElementById('set-target-listen').value = state.targets.listen;
        document.getElementById('set-target-read').value = state.targets.read;
        document.getElementById('set-target-write').value = state.targets.write;
        document.getElementById('set-gamify').checked = Boolean(state.gamify);
        document.getElementById('settings-modal').classList.remove('hidden');
      });
      document.getElementById('close-settings-btn').addEventListener('click', () => document.getElementById('settings-modal').classList.add('hidden'));
      document.getElementById('save-settings-btn').addEventListener('click', async () => {
        state.aiConfig = {
          mode: document.getElementById('ai-mode-worker').checked ? 'worker' : 'direct',
          baseUrl: document.getElementById('set-ai-baseurl').value.trim() || 'https://api.deepseek.com/chat/completions',
          model: document.getElementById('set-ai-model').value.trim() || 'deepseek-chat',
          apiKey: document.getElementById('set-ai-key').value.trim(),
          workerUrl: document.getElementById('set-worker-url').value.trim()
        };
        state.targets = {
          listen: parseInt(document.getElementById('set-target-listen').value, 10) || 175,
          read: parseInt(document.getElementById('set-target-read').value, 10) || 210,
          write: parseInt(document.getElementById('set-target-write').value, 10) || 160
        };
        state.gamify = document.getElementById('set-gamify').checked;
        if(!await saveState())return;
        document.getElementById('settings-modal').classList.add('hidden');
        renderHeaderExtras();
        renderDashboard();
        showToast('设置已保存到本机');
      });

      document.getElementById('export-json-btn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify({...state,originalReading:JSON.parse(window.C6Storage.read('c6_original_reading_v1')||'null')}, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `cet6-coach-backup-${todayStr()}.json`; a.click();
        URL.revokeObjectURL(url);
      });
      document.getElementById('reset-demo-btn').addEventListener('click', () => {
        state = getDefaultState(); saveState();
        document.getElementById('settings-modal').classList.add('hidden');
        renderHeaderExtras(); switchTab('dashboard'); showToast('已恢复初始配置');
      });

      // ---------- Init ----------
      bindGlobalLongPressLookup();
      startAutoStudyTimer();
      loadWordImageryBank();
      loadListeningIndex();
      renderHeaderExtras();
      switchTab(new URLSearchParams(location.search).get('view') === 'reading' ? 'reading' : (state.activeTab || 'dashboard'));
    })();
  </script>
</body>
</html>
